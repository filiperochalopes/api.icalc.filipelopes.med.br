services:
  drcalc-api:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "${APP_PORT}:4000"
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASS}@drcalc-db:3306/${DB_NAME}
    networks:
      - proxy
      - data
    depends_on:
      drcalc-db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  drcalc-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true
  data:
    external: true
